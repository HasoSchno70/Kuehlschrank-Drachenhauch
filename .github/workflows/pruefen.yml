# Prueft die Kuehlschrank-App gegen die neueste freigegebene Fassung von
# Drachenhauch. Die Sammlungen starten das Studio aus dem Quelltext von
# Drachenhauch, der neben diesem Repo liegen muss (../Drachenhauch) --
# darum liegen hier beide Repos nebeneinander im Arbeitsordner, Drachenhauch
# in genau der Fassung, aus der auch dhrt kommt. Studio und App oeffnen
# Fenster: ein virtueller Bildschirm (xvfb) mit Software-OpenGL.
# Jeden Montag auch ohne Aenderung, damit eine neue Drachenhauch-Fassung,
# die etwas bricht, auffaellt.

name: Pruefen

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "53 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Kuehlschrank-Drachenhauch

      - name: xvfb und die Bibliotheken fuer dhrt
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libgtk-3-0t64 libasound2t64 libudev1 libgl1 libegl1 libgles2 libx11-6 libxrandr2 libxi6 libxinerama1 libxcursor1 libwayland-client0 libxkbcommon0

      - name: Drachenhauch holen (dhrt und Quelltext derselben Fassung)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(gh release view --repo HasoSchno70/Drachenhauch --json tagName -q .tagName)"
          echo "Drachenhauch $TAG"
          gh release download "$TAG" --repo HasoSchno70/Drachenhauch --pattern '*linux-x86_64.tar.gz' --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP"/*.tar.gz -C "$RUNNER_TEMP"
          DHRT="$(find "$RUNNER_TEMP" -type f -name dhrt | head -n 1)"
          chmod +x "$DHRT"
          echo "DHRT=$DHRT" >> "$GITHUB_ENV"
          "$DHRT" --version
          git clone --depth 1 --branch "$TAG" https://github.com/HasoSchno70/Drachenhauch.git Drachenhauch

      - name: Pruefsammlungen
        working-directory: Kuehlschrank-Drachenhauch
        env:
          DH_OHNE_AUDIO: "1"
        run: xvfb-run -a -s "-screen 0 1920x1080x24" "$DHRT" test tests/pruef
